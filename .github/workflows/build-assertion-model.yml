# Builds the assertion model branches of this fork. build.yml only runs for master, so without
# this the assertion-model PRs carry no checks. These branches compile against an openmrs-core
# 3.0.0-SNAPSHOT that is not published anywhere, so the job builds it first from the core fork.
name: Build assertion model branches

on:
  push:
    branches:
      - 'assertion-model/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The core branch carrying the API these branches compile against. Move it to
  # assertion-model/main once the core PRs below it have merged.
  CORE_REF: assertion-model/p1-privileges-daemon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/openmrs-core
          ref: ${{ env.CORE_REF }}
          path: openmrs-core
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Install openmrs-core
        # the core branch moves on its own, so record which commit this run was built against
        run: |
          echo "Built against openmrs-core $(git -C openmrs-core rev-parse HEAD) ($CORE_REF)" >> "$GITHUB_STEP_SUMMARY"
          mvn install -DskipTests=true -D"maven.javadoc.skip"=true -D"spotbugs.skip"=true --batch-mode --file openmrs-core/pom.xml
          rm -rf openmrs-core
      - name: Build and test
        run: mvn clean install --batch-mode --show-version --file pom.xml
